name: Release

# Build artefak rilis dari commit di `main` saat tag v* di-push.
# Upload ke Play Console tetap manual (atau tambahkan langkah fastlane nanti).

on:
  push:
    tags: ['v*']

permissions:
  contents: read

env:
  ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}

jobs:
  build:
    name: Build release AAB
    runs-on: ubuntu-latest

    steps:
      - name: Checkout (tag)
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Restore upload keystore
        if: env.ANDROID_KEYSTORE_BASE64 != ''
        run: |
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > android/upload-keystore.jks
          cat > android/key.properties <<EOF
          storePassword=${{ secrets.ANDROID_STORE_PASSWORD }}
          keyPassword=${{ secrets.ANDROID_KEY_PASSWORD }}
          keyAlias=${{ secrets.ANDROID_KEY_ALIAS }}
          storeFile=../upload-keystore.jks
          EOF

      - name: Build app bundle
        run: flutter build appbundle --release

      - name: Upload app bundle
        uses: actions/upload-artifact@v4
        with:
          name: zunixe-release-${{ github.ref_name }}
          path: build/app/outputs/bundle/release/app-release.aab
          if-no-files-found: error
